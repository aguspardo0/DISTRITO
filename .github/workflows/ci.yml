name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET — compilar y probar
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: distrito
          POSTGRES_PASSWORD: distrito_dev
          POSTGRES_DB: distrito
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distrito -d distrito"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DISTRITO_TEST_DB: Host=localhost;Port=5432;Database=distrito;Username=distrito;Password=distrito_dev;Timeout=5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restaurar
        run: .github/scripts/run-annotated.sh dotnet restore Distrito.sln

      - name: Compilar
        run: .github/scripts/run-annotated.sh dotnet build Distrito.sln --no-restore -c Debug

      - name: Pruebas
        run: .github/scripts/run-annotated.sh dotnet test Distrito.sln --no-build -c Debug --logger "console;verbosity=normal" --logger "trx" --results-directory TestResults

      - name: Resumen de pruebas
        if: always() && hashFiles('TestResults/*.trx') != ''
        run: |
          for f in TestResults/*.trx; do
            line=$(grep -o '<Counters [^>]*>' "$f")
            total=$(echo "$line" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passed=$(echo "$line" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            failed=$(echo "$line" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            name=$(grep -o 'storage="[^"]*\.dll"' "$f" | head -1 | sed 's/.*\///; s/\.dll"//')
            echo "::notice title=Pruebas ${name}::total=${total} ok=${passed} fallidas=${failed}"
          done

  godot:
    name: Godot — arranque, red y persistencia de punta a punta
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: distrito
          POSTGRES_PASSWORD: distrito_dev
          POSTGRES_DB: distrito
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distrito -d distrito"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DISTRITO_TEST_DB: Host=localhost;Port=5432;Database=distrito;Username=distrito;Password=distrito_dev;Timeout=5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Descargar Godot ${{ env.GODOT_VERSION }} .NET
        run: .github/scripts/install-godot.sh

      - name: Compilar C# del juego y el backend
        run: |
          .github/scripts/run-annotated.sh dotnet build game/Distrito.Game.csproj -c Debug
          .github/scripts/run-annotated.sh dotnet build backend/Distrito.Backend/Distrito.Backend.csproj -c Debug

      - name: Importar proyecto
        run: timeout 300 "$GODOT" --headless --path game --import

      - name: Arrancar en modo servidor (smoke test)
        run: |
          timeout 60 "$GODOT" --headless --path game -- --server --smoke-test 2>&1 | tee boot.log
          grep -q "SMOKE_TEST_OK" boot.log
          echo "::notice title=Godot servidor::$(grep 'Arranque OK' boot.log)"

      - name: Arrancar en modo cliente (smoke test)
        run: |
          timeout 60 "$GODOT" --headless --path game -- --client --smoke-test 2>&1 | tee boot-client.log
          grep -q "SMOKE_TEST_OK" boot-client.log
          echo "::notice title=Godot cliente::$(grep 'Arranque OK' boot-client.log)"

      - name: Prueba de red — servidor dedicado + 2 clientes bot
        run: .github/scripts/network-test.sh

      - name: Prueba de persistencia — cuentas, guardado y regreso
        run: .github/scripts/persistence-test.sh

      - name: Logs de las pruebas de red
        if: always()
        run: |
          for f in net-*.log persist-*.log; do echo "===== $f"; grep -E "DISTRITO|ERROR|error|Exception" "$f" | head -40 || true; done

  load:
    name: Escala — interés de red y carga (10 y 20 jugadores)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Descargar Godot ${{ env.GODOT_VERSION }} .NET
        run: .github/scripts/install-godot.sh

      - name: Compilar e importar
        run: |
          .github/scripts/run-annotated.sh dotnet build game/Distrito.Game.csproj -c Debug
          timeout 300 "$GODOT" --headless --path game --import

      - name: Pruebas de escala
        run: |
          echo "::notice title=Máquina de prueba::$(nproc) núcleos, $(free -g | awk '/Mem/{print $2}') GB RAM (servidor y clientes comparten la misma máquina)"
          .github/scripts/load-test.sh 10 20

  export-windows:
    name: Exportar Windows y publicar prototipo
    needs: [dotnet, godot]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Descargar Godot ${{ env.GODOT_VERSION }} .NET
        run: .github/scripts/install-godot.sh

      - name: Cache de plantillas de exportación
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-mono-${{ env.GODOT_VERSION }}

      - name: Descargar plantillas de exportación
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dest/"
          ls "$dest" | head -30

      - name: Importar proyecto
        run: timeout 300 "$GODOT" --headless --path game --import

      - name: Leer servidor de pruebas
        run: |
          # deploy/target.env manda: la IP y el usuario no son secretos y así no quedan desactualizados en GitHub.
          if [ -f deploy/target.env ]; then
            # Se copian con otro nombre para que no los pise un secreto viejo con el mismo nombre.
            grep -E '^DEPLOY_HOST=' deploy/target.env | sed 's/^DEPLOY_HOST=/TARGET_HOST=/' >> "$GITHUB_ENV"
            grep -E '^DEPLOY_USER=' deploy/target.env | sed 's/^DEPLOY_USER=/TARGET_USER=/' >> "$GITHUB_ENV"
          fi

      - name: Apuntar el cliente al servidor oficial
        if: env.TARGET_HOST != '' || env.DEPLOY_HOST != ''
        run: |
          host="${TARGET_HOST:-$DEPLOY_HOST}"
          domain="$(echo "$host" | tr . -).sslip.io"
          printf '{"backendUrl":"https://%s","gameHost":"%s"}\n' "$domain" "$host" > game/server_defaults.json
          cat game/server_defaults.json

      - name: Exportar
        run: |
          mkdir -p build/windows
          timeout 600 "$GODOT" --headless --path game --export-release "Windows" ../build/windows/DISTRITO.exe 2>&1 | tee export.log
          test -f build/windows/DISTRITO.exe
          cp .github/scripts/LEEME-prototipo.txt build/windows/LEEME.txt
          ls -la build/windows
          (cd build && zip -qr ../DISTRITO-windows.zip windows)
          echo "::notice title=Export Windows::$(du -h DISTRITO-windows.zip | cut -f1) — commit ${GITHUB_SHA::7}"

      - name: Publicar en la release "prototipo"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prototipo --yes --cleanup-tag || true
          gh release create prototipo DISTRITO-windows.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Prototipo (último build de main)" \
            --notes "Build automático del commit ${GITHUB_SHA::7}. Descargá DISTRITO-windows.zip, descomprimilo y abrí DISTRITO.exe. Instrucciones en LEEME.txt."

  deploy:
    name: Desplegar al servidor y probarlo
    needs: [dotnet, godot]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency: deploy-production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v5

      - name: Leer servidor de pruebas
        run: |
          # deploy/target.env manda: la IP y el usuario no son secretos y así no quedan desactualizados en GitHub.
          if [ -f deploy/target.env ]; then
            # Se copian con otro nombre para que no los pise un secreto viejo con el mismo nombre.
            grep -E '^DEPLOY_HOST=' deploy/target.env | sed 's/^DEPLOY_HOST=/TARGET_HOST=/' >> "$GITHUB_ENV"
            grep -E '^DEPLOY_USER=' deploy/target.env | sed 's/^DEPLOY_USER=/TARGET_USER=/' >> "$GITHUB_ENV"
          fi

      - name: Verificar configuración
        run: |
          if [ -z "${TARGET_HOST:-$DEPLOY_HOST}" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice title=Despliegue::Falta el secreto DEPLOY_SSH_KEY (o el servidor). Se arma el release pero no se despliega."
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Descargar Godot ${{ env.GODOT_VERSION }} .NET
        run: .github/scripts/install-godot.sh

      - name: Cache de plantillas de exportación
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-mono-${{ env.GODOT_VERSION }}

      - name: Descargar plantillas de exportación
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dest/"

      - name: Detectar arquitectura del servidor
        run: |
          arch=x64
          if [ -n "${TARGET_HOST:-$DEPLOY_HOST}" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            key="$RUNNER_TEMP/k"
            .github/scripts/prepare-key.sh "$key" || exit 1
            machine=""
            for attempt in 1 2 3; do
              machine=$(ssh -i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes \
                "${TARGET_USER:-${DEPLOY_USER:-ubuntu}}@${TARGET_HOST:-$DEPLOY_HOST}" uname -m 2>ssh-err.txt) && break
              sleep 15
            done
            rm -f "$key"
            echo "Servidor: $machine"
            case "$machine" in
              aarch64|arm64) arch=arm64 ;;
              x86_64) arch=x64 ;;
              *) echo "::error title=Despliegue::no se pudo conectar por SSH a ${TARGET_USER:-${DEPLOY_USER:-ubuntu}}@${TARGET_HOST:-$DEPLOY_HOST} — $(tail -2 ssh-err.txt | tr '\n' ' ')"; exit 1 ;;
            esac
          fi
          echo "ARCH=$arch" >> "$GITHUB_ENV"
          if [ "$arch" = arm64 ]; then echo "PRESET=Linux Server ARM64" >> "$GITHUB_ENV"; else echo "PRESET=Linux Server x64" >> "$GITHUB_ENV"; fi

      - name: Armar release (backend + servidor de juego, Linux ${{ env.ARCH }})
        run: |
          .github/scripts/run-annotated.sh dotnet publish backend/Distrito.Backend/Distrito.Backend.csproj \
            -c Release -r "linux-$ARCH" --self-contained true -o build/release/backend
          timeout 300 "$GODOT" --headless --path game --import
          mkdir -p build/server
          timeout 600 "$GODOT" --headless --path game --export-release "$PRESET" ../build/server/DistritoServer 2>&1 | tail -20
          test -f build/server/DistritoServer
          mv build/server build/release/server
          ls build/release/backend/migrations build/release/server
          echo "::notice title=Release Linux $ARCH::backend $(du -sh build/release/backend | cut -f1), servidor $(du -sh build/release/server | cut -f1)"

      - name: Desplegar
        if: (env.TARGET_HOST != '' || env.DEPLOY_HOST != '') && env.DEPLOY_SSH_KEY != ''
        run: .github/scripts/deploy.sh

      - name: Prueba contra el servidor real
        if: (env.TARGET_HOST != '' || env.DEPLOY_HOST != '') && env.DEPLOY_SSH_KEY != ''
        run: |
          # El certificado HTTPS se emite en el primer arranque de Caddy: se reintenta hasta 3 minutos.
          ok=0
          for i in $(seq 1 36); do
            if curl -fsS -m 10 "https://$DEPLOY_DOMAIN/health/ready"; then ok=1; echo; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            key="$RUNNER_TEMP/k2"; .github/scripts/prepare-key.sh "$key" >/dev/null
            ssh -i "$key" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "${TARGET_USER:-root}@${TARGET_HOST:-$DEPLOY_HOST}" \
              "systemctl is-active caddy distrito-backend distrito-gameserver; ufw status | head -8; journalctl -u caddy -n 25 --no-pager" > diag.txt 2>&1 || true
            cat diag.txt
            grep -iE "error|fail|denied|refused|inactive|timeout" diag.txt | tail -6 | while IFS= read -r l; do echo "::error title=Servidor real (diagnóstico)::${l:0:500}"; done
            echo "::error title=Servidor real::https://$DEPLOY_DOMAIN no respondió"
            exit 1
          fi
          dotnet build game/Distrito.Game.csproj -c Debug -v q -nologo > /dev/null
          # cuenta de CI estable; la contraseña deriva de un secreto, no está en el repo
          pass=$(printf '%s' "$DEPLOY_SSH_KEY-ci" | sha256sum | cut -c1-32)
          timeout 90 "$GODOT" --headless --path game -- \
            --client --host "${TARGET_HOST:-$DEPLOY_HOST}" --port 7777 --backend "https://$DEPLOY_DOMAIN" \
            --account ci_bot --password "$pass" --character "Bot Despliegue" \
            --bot --test-seconds 12 --expect-players 1 > prod-test.log 2>&1 || true
          line=$(grep -h "NET_TEST_" prod-test.log | tail -1)
          if grep -q NET_TEST_OK prod-test.log; then
            echo "::notice title=Servidor real::https://$DEPLOY_DOMAIN — ${line#*\] }"
          else
            grep -E "DISTRITO|xception|ERROR" prod-test.log | grep -v "PagedAllocator" | tail -6 | while IFS= read -r l; do echo "::error title=Bot contra servidor real::${l:0:400}"; done
            [ -s prod-test.log ] || echo "::error title=Bot contra servidor real::el log está vacío"
            key="$RUNNER_TEMP/k3"; .github/scripts/prepare-key.sh "$key" >/dev/null
            ssh -i "$key" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "${TARGET_USER:-root}@${TARGET_HOST:-$DEPLOY_HOST}" \
              "journalctl -u distrito-gameserver -n 60 --no-pager -o cat | grep -E '\\[DISTRITO\\]|ERROR' | grep -v PagedAllocator | tail -3" 2>&1 | tail -3 | while IFS= read -r l; do echo "::error title=Servidor de juego::${l:0:400}"; done
            echo "::error title=Servidor real::${line:-sin resultado}"
            exit 1
          fi
