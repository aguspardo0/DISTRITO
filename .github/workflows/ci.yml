name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET — compilar y probar
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: distrito
          POSTGRES_PASSWORD: distrito_dev
          POSTGRES_DB: distrito
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distrito -d distrito"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DISTRITO_TEST_DB: Host=localhost;Port=5432;Database=distrito;Username=distrito;Password=distrito_dev;Timeout=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Aplicar esquema de base de datos
        env:
          PGPASSWORD: distrito_dev
        run: |
          for f in database/init/*.sql; do
            echo "Aplicando $f"
            psql -h localhost -U distrito -d distrito -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Restaurar
        run: dotnet restore Distrito.sln

      - name: Compilar
        run: dotnet build Distrito.sln --no-restore -c Debug

      - name: Pruebas
        run: dotnet test Distrito.sln --no-build -c Debug --logger "console;verbosity=normal" --logger "trx" --results-directory TestResults

      - name: Resumen de pruebas
        if: always()
        run: |
          for f in TestResults/*.trx; do
            line=$(grep -o '<Counters [^>]*>' "$f")
            total=$(echo "$line" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passed=$(echo "$line" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            failed=$(echo "$line" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            name=$(grep -o 'storage="[^"]*\.dll"' "$f" | head -1 | sed 's/.*\///; s/\.dll"//')
            echo "::notice title=Pruebas ${name}::total=${total} ok=${passed} fallidas=${failed}"
          done

  godot:
    name: Godot — importar y arrancar headless
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Descargar Godot ${{ env.GODOT_VERSION }} .NET
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q godot.zip -d "$HOME/godot"
          bin=$(find "$HOME/godot" -maxdepth 2 -type f -name 'Godot_v*mono_linux*x86_64' | head -1)
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Compilar C# del juego
        run: dotnet build game/Distrito.Game.csproj -c Debug

      - name: Importar proyecto
        run: timeout 300 "$GODOT" --headless --path game --import

      - name: Arrancar en modo servidor (smoke test)
        run: |
          timeout 60 "$GODOT" --headless --path game -- --server --smoke-test 2>&1 | tee boot.log
          grep -q "SMOKE_TEST_OK" boot.log
          echo "::notice title=Godot servidor::$(grep 'Arranque OK' boot.log)"

      - name: Arrancar en modo cliente (smoke test)
        run: |
          timeout 60 "$GODOT" --headless --path game -- --client --smoke-test 2>&1 | tee boot-client.log
          grep -q "SMOKE_TEST_OK" boot-client.log
          echo "::notice title=Godot cliente::$(grep 'Arranque OK' boot-client.log)"
